# Temporaneo: verifica che i runner GitHub raggiungano gli open data pubblici del Portale Offerte ARERA.
name: Prova fonti offerte
on:
  push:
    branches: [claude/project-thread-e60jw0]
    paths: [.github/workflows/probe-offerte.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for d in 0 1 2 3; do
            day=$(date -u -d "-$d day" +%Y%m%d); ym=$(date -u -d "-$d day" +%Y_%-m)
            for k in E G; do
              u="https://www.ilportaleofferte.it/portaleOfferte/resources/opendata/csv/offerteML/${ym}/PO_Offerte_${k}_MLIBERO_${day}.xml"
              code=$(curl -sS -m 60 -A "Mozilla/5.0" -o "o_${k}_${day}.xml" -w "%{http_code} %{size_download}" "$u" || echo fail)
              echo "$k $day -> $code"
            done
          done
          f=$(ls -S o_E_*.xml | head -1); echo "== $f"; head -c 6000 "$f"; echo
          echo "== tag distinti"; grep -o '<[A-Za-z_]*' "$f" | sort | uniq -c | sort -rn | head -80
          f=$(ls -S o_G_*.xml | head -1); echo "== $f"; grep -o '<[A-Za-z_]*' "$f" | sort | uniq -c | sort -rn | head -30
