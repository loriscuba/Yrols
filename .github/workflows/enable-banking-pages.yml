# Pubblica la pagina di ritorno del consenso bancario su GitHub Pages:
# https://loriscuba.github.io/Yrols/callback/
# Richiede: Settings → Pages → Source = "GitHub Actions".
name: Pagina callback Enable Banking

on:
  push:
    branches: [main]
    paths: ["connectors/enable-banking/pages/**", ".github/workflows/enable-banking-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: connectors/enable-banking/pages
      - id: deployment
        uses: actions/deploy-pages@v4
